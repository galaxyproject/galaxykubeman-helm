galaxy:
  version: '6.1.1'
  chart:
    repository: https://ksuderman.github.io/helm_charts
  service:
    type: LoadBalancer
    port: 80
  serviceAccount:
    annotations:
      iam.gke.io/gcp-service-account: cnpg-backup-sa@anvil-and-terra-development.iam.gserviceaccount.com
  configs:
    "galaxy.yml":
      galaxy:
        admin_users: admin@cloudve.org
        master_api_key: galaxypassword
        single_user: admin@cloudve.org
    "job_conf.yml":
      runners:
        k8s:
          k8s_node_selector: "cloud.google.com/gke-nodepool: default-pool"
  jobs:
    rules:
      # Used during development to ensure jobs will run on smaller instances
      tpv_rules_local.yml:
        destinations:
          k8s:
            max_cores: 2
            # Memory must be an integer value, will be in Gi units
            max_mem: 16
  nodeSelector:
    "cloud.google.com/gke-nodepool": "default-pool"
  persistence:
    storageClass: "nfs-gkmns"
    size: "200Gi"
  postgresql:
    postgresqlPostgresPassword: postgres
    galaxyDatabasePassword: galaxypassword
    recovery:
      enabled: false
      path: gs://ks-anvil-bucket
    backup:
      enabled: true
      path: gs://ks-anvil-bucket
    operator:
      operatorSpecExtra:
        affinity:
          nodeSelector:
            "cloud.google.com/gke-nodepool": "default-pool"
        storage:
          pvcTemplate:
            volumeName: "galaxy-postgres-pv"
  rabbitmq:
    nodeSelector:
      "cloud.google.com/gke-nodepool": "default-pool"
    persistence:
      storageClassName: "nfs-gkmns"
      # FIXME: Setting the size for rabbitmq is not working?
      # size: 1Gi
  ingress:
    annotations: {}
    ingressClassName: ""
    tls: []

nfs:
  nodeSelector:
    "cloud.google.com/gke-nodepool": "default-pool"
  persistence:
    existingClaim: "galaxy-nfs-pvc"
  storageClass:
    name: "nfs-gkmns"

persistence:
  nfs:
    persistentVolume:
      extraSpec:
        gcePersistentDisk:
          pdName: "ks-nfs-pd"
  postgres:
    persistentVolume:
      extraSpec:
        csi:
          volumeHandle: "projects/anvil-and-terra-development/zones/us-east1-b/disks/ks-postgres-pd"

rbac:
  serviceAccount: gkm-gkm-cm-svc-account
