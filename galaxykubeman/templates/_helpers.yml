{{/*
Expand the name of the chart.
*/}}
{{- define "galaxykubeman.name" -}}
{{- default .Chart.Name .Values.nameOverride | trunc 63 | trimSuffix "-" -}}
{{- end -}}

{{/*
Create a default fully qualified app name.
We truncate at 63 chars because some Kubernetes name fields are limited to this (by the DNS naming spec).
If release name contains chart name it will be used as a full name.
*/}}
{{- define "galaxykubeman.fullname" -}}
{{- if .Values.fullnameOverride -}}
{{- .Values.fullnameOverride | trunc 63 | trimSuffix "-" -}}
{{- else -}}
{{- $name := default .Chart.Name .Values.nameOverride -}}
{{- if contains $name .Release.Name -}}
{{- .Release.Name | trunc 63 | trimSuffix "-" -}}
{{- else -}}
{{- printf "%s-%s" .Release.Name $name | trunc 63 | trimSuffix "-" -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{/*
Define pod priority class
*/}}
{{- define "galaxykubeman.pod-priority-class" -}}
{{- if .Values.galaxy.jobs.priorityClass.existingClass -}}
{{- tpl .Values.galaxy.jobs.priorityClass.existingClass . -}}
{{- else -}}
{{- printf "%s-job-priority" (include "galaxykubeman.fullname" .) -}}
{{- end -}}
{{- end -}}

{{/*
Create chart name and version as used by the chart label.
*/}}
{{- define "galaxykubeman.chart" -}}
{{- printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" -}}
{{- end -}}

{{- define "galaxykubeman.roleName" -}}
{{- default (printf "%s-%s" .Release.Namespace "rbac") .Values.rbac.nameOverride | trunc 63 | trimSuffix "-" -}}
{{- end -}}

{{/*
Get default value or max
*/}}
{{- define "galaxykubeman.max_value" -}}
  {{-  if gt (.default | int) (.max | int) }}
    {{- .max | int }}
  {{- else }}
    {{- .default | int }}
  {{- end }}
{{- end }}

{{- define "galaxykubeman.hibernate-cluster" -}}
start_time=$SECONDS
cluster=$(kubectl get cluster -n {{ .Release.Namespace }} -o jsonpath='{.items[0].metadata.name}')
kubectl annotate cluster $cluster -n {{ .Release.Namespace }} --overwrite cnpg.io/hibernation=on
echo "Waiting for cluster $cluster  to hibernate"
while true; do
  # Check if "cnpg.io/hibernation" condition is present and status is True
  status=$(kubectl get cluster $cluster -n {{ .Release.Namespace }} -o jsonpath='{.status.conditions[?(@.type=="cnpg.io/hibernation")].status}')
  if [ "$status" = "True" ]; then
      echo "Cluster $cluster is now hibernated."
      break
  fi
  sleep 5
done
echo
dt=$(( SECONDS - start_time ))
printf "Hibernation took %d:%02d\n" $(( dt / 60 )) $(( dt % 60 ))
{{- end }}

